---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-checkup-config
  namespace: default
data:
  spec.timeout: 10m
  spec.param.storageClass: 	lh-v2-engine #storage class volume binding mode needs to be immediate else pvc checks will fail
  spec.param.numOfVMs: "2"
  spec.param.skipTeardown: "onfailure"
  spec.param.imageDisplayName: "opensuse-lh-v2"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-checkup
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccount: storage-checkup-sa
      restartPolicy: Never
      containers:
        - name: storage-checkup
          image: gmehta3/kubevirt-storage-checkup:dev
          imagePullPolicy: Always
          env:
            - name: CONFIGMAP_NAMESPACE
              value: default
            - name: CONFIGMAP_NAME
              value: storage-checkup-config
